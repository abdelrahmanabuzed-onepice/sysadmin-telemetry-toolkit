[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sysadmin-telemetry-toolkit"
version = "1.0.0"
description = "Production-grade system administration telemetry, diagnostic monitoring, and automated maintenance toolkit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Abdelrahman Abouzed", email = "abdelrahman.abouzed@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
sysadmin-cli = "sysadmin_telemetry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
